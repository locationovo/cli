name: Build gh for iOS

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: |
          git clone https://github.com/cli/cli.git
          cd cli
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o gh ./cmd/gh
      - uses: actions/upload-artifact@v4
        with:
          name: gh-ios-arm64-dynamic
          path: cli/gh
